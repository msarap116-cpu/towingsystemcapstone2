<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vehicles - GoodWrench</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/requestform.css">

    <style>
        .vehicles-wrapper {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px 60px;
        }

        .page-title {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .form-container {
            background: #fff;
            padding: 32px 36px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
            border: 1px solid #eef2f6;
            margin-bottom: 24px;
        }

        .vehicle-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 16px;
            border: 1px solid #2e3032;
            margin-bottom: 12px;
        }

        .vehicle-card.is-default {
            border-color: #0a2b3e;
            background: #f7fafc;
        }

        .vehicle-info h4 {
            margin: 0 0 4px;
            font-size: 15px;
            color: #0f172a;
        }

        .vehicle-info p {
            margin: 0;
            font-size: 13px;
            color: #64748b;
        }

        .default-badge {
            display: inline-block;
            background: #0a2b3e;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 8px;
        }

        .vehicle-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .vehicle-actions button {
            border: 1px solid #e2e8f0;
            background: #fff;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
        }

        .vehicle-actions button:hover {
            background: #f1f5f9;
        }

        .vehicle-actions .btn-danger {
            color: #dc2626;
            border-color: #fca5a5;
        }

        #emptyState {
            text-align: center;
            color: #64748b;
            padding: 20px 0;
            display: none;
        }

        .row {
            display: flex;
            gap: 16px;
        }

        .row .form-group {
            flex: 1;
        }

        @media (max-width: 600px) {
            .row {
                flex-direction: column;
            }
        }
        /* ===== CHECKBOX (default vehicle) ===== */
.checkbox-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 14px;
    color: #111827;
    cursor: pointer;
    margin-bottom: 0;
    user-select: none;
}

/* Reset checkbox to a normal, plain size — overrides global input rules */
.checkbox-label input[type="checkbox"] {
    width: 18px;
    height: 18px;
    min-width: 18px;
    margin: 0;
    padding: 0;
    border: 1.5px solid #111827;
    border-radius: 3px;
    background: #fff;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    box-shadow: none;
    transition: none;
}

/* Black tick when checked */
.checkbox-label input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 1px;
    width: 5px;
    height: 10px;
    border: solid #000;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
}

/* Remove the red focus ring you had on inputs */
.checkbox-label input[type="checkbox"]:focus {
    outline: none;
    border-color: #111827;
    box-shadow: none;
}
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a class="navbar-brand" href="index">
                <!-- <span class="brand-icon">🎉</span> -->
                <span class="brand-text">GoodWrench</span>
            </a>
            <ul class="nav-menu">
                <li class="nav-item"><a class="nav-link" href="dashboard"> Dashboard</a></li>
                <li class ="nav-item"><a class="nav-link" href="requestform.html">Requst form</a></li>
            </ul>
        </div>
    </nav>

    <div class="vehicles-wrapper">
        <h2 class="page-title">My Vehicles</h2>

        <!-- Saved vehicles list -->
        <div class="form-container">
            <div id="vehicleList"></div>
            <p id="emptyState">You haven't added a vehicle yet. Add one below.</p>
        </div>

        <!-- Add vehicle form -->
        <div class="form-container">
            <h3 style="margin-top:0;"> Add a Vehicle</h3>
            <form id="vehicleForm">
                <div class="row">
                    <div class="form-group">
                        <label for="vehicleType">Vehicle Type</label>
                        <input type="text" id="vehicleType" placeholder="e.g. Sedan, SUV, Truck" required>
                    </div>
                    <div class="form-group">
                        <label for="year">Year Model</label>
                        <input type="number" id="year" placeholder="e.g. 2020" min="1980" max="2100">
                    </div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="make">Model</label>
                        <input type="text" id="make" placeholder="e.g. Toyota" required>
                    </div>
                    <div class="form-group">
                        <label for="model">Brand</label>
                        <input type="text" id="model" placeholder="e.g. Vios" required>
                    </div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="color">Color</label>
                        <input type="text" id="color" placeholder="e.g. White" required>
                    </div>
                    <div class="form-group">
                        <label for="licensePlate">License Plate</label>
                        <input type="text" id="licensePlate" placeholder="e.g. ABC 1234" required>
                    </div>
                </div>

<div class="form-group checkbox-group">
    <label class="checkbox-label">
        <input type="checkbox" id="isDefault">
        <span>Set as default vehicle</span>
    </label>
</div>

                <button type="submit" class="btn-submit">Add Vehicle</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/myvehicles.js"></script>
</body>
</html>
