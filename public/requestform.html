<!-- request form -->
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Emergency Assistance - Towing Help</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/requestform.css">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">
    <div class="nav-container">

        <a class="navbar-brand" href="index">Tow Assist</a>

        <ul class="nav-menu">
            <li class="nav-item"><a class="nav-link" href="dashboard">dashboard</a></li>
        </ul>
       
        </a>

    </div>
</nav>


<!-- MAIN CONTENT -->

<section class="emergency-section">

<h2 class="page-title">
Request Roadside Assistance
</h2>


<div class="form-container">

<form id="emergencyForm">

<!-- SERVICE TYPE -->

<div class="form-group">

<label>Service Needed:</label>

<select id="serviceType" required>

<option value="">Select Service</option>
<option value="towing">Towing Service</option>
<option value="flat_tire">Flat Tire Change</option>
<option value="jump_start">Jump Start</option>
<option value="fuel">Fuel Delivery</option>
<option value="lockout">Lockout Service</option>

</select>

</div>


<!-- VEHICLE TYPE -->

<div class="form-group">

<label>Vehicle Type:</label>

<input 
type="text" 
id="vehicleType"
placeholder="e.g., Sedan, SUV, Truck"
required
>

</div>


<!-- LICENSE -->

<div class="form-group">

<label>License Plate:</label>

<input 
type="text" 
id="licensePlate"
required
>

</div>


<!-- LOCATION -->

<div class="form-group">

<label>Your Location:</label>

<button 
type="button"
class="btn-secondary"
onclick="getCurrentLocation()"
id="getLocationBtn">

Use Current Location

</button>

<div id="locationStatus" class="location-status"></div>

<input type="hidden" id="latitude">
<input type="hidden" id="longitude">


<div class="manual-address">
    <label>Or Enter Address:</label>
    <textarea id="address" rows="2" placeholder="Enter your full address (e.g., 123 Main St, City, Province)"></textarea>
    <small style="color: #ac1b1b; display: block; margin-top: 5px;">
        💡 Tip: Click "Search Address" after typing to get coordinates, or use "Use Current Location"
    </small>
</div>

</div>


<!-- SUBMIT -->

<button 
type="submit"
class="btn-danger submit-btn">

Request Assistance

</button>

</form>


<!-- CONFIRMATION -->

<div id="confirmation" class="confirmation-box">

<h4>Request Submitted!</h4>

<p>Your request ID: <strong id="requestId"></strong></p>

<p>Estimated arrival time: <strong>25-40 minutes</strong></p>

<p>You can track your request in the dashboard.</p>

</div>


</div>

</section>


<!-- JAVASCRIPT -->
<script src="js/app.js"></script>
<script src="js/requestform.js"></script>

</body>
</html>
