<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Towing Assistance</title>

    <script>
        if(localStorage.getItem('token')){
            window.location.replace('dashboard');
        }
    </script>

    <link rel="stylesheet" href="css/login.css">

</head>
<body>
 
    <nav class="navbar">
        <div class="nav-container">
            <a class="navbar-brand" href="home">Tow Assist</a>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="home">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="register">Register</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <div class="login-card">
            <h2 class="text-center">Login to Your Account</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="custom-input" required>
                </div>
                
               <div class="form-group">
                    <label for="password">Password</label>
                         <div class="password-wrapper">
                             <input type="password" id="password" class="custom-input" required>
                            <button type="button" class="toggle-password" aria-label="Show password">
                      <span class="eye-icon">👁️</span>
                     <span class="eye-slash-icon" style="display: none;">🙈</span>
                        </button>
                    </div>
                </div>
                <!-- <div class="form-check">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Remember me</label>
                </div> -->
                
                <button type="submit" id="loginBtn" class="btn-submit">Login</button>
            </form>
            
            <div class="form-footer">
                <p>Don't have an account? <a href="register">Register here</a></p>
                <!-- <p><a href="#">Forgot password?</a></p> -->
            </div>
        </div>
    </main>

    <div id="alertContainer"></div>

    <script src="js/app.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
