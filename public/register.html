<body>

    <!-- ===== NAVBAR (GoodWrench style) ===== -->
    <nav class="navbar">
        <div class="nav-container">
            <a class="navbar-brand" href="home">
                <span class="brand-icon">🎉</span>
                <span class="brand-text">GoodWrench</span>
            </a>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="login">Login</a>
                </li>
                 <li class="nav-item">
                    <a class="nav-link" href="requestform">Request</a>
                </li>
            </ul>
        </div>
    </nav>


    <!-- ===== REGISTER FORM ===== -->
    <div class="form-wrapper">
        <div class="container">
            <div class="form-container">
                <div class="register-header">
                    <span class="register-icon">📝</span>
                    <h2>Create Account</h2>
                    <p>mga pisot mong tanan</p>
                </div>

                <form id="registerForm">
                    <!-- Row 1: Name + Email -->
                    <div class="row">
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" placeholder="Enter your full name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" placeholder="Enter your email" required>
                            <div id="emailSuggestion"
                                style="display: none; color: #856404; background-color: #fff3cd; padding: 8px; border-radius: 4px; margin-top: 5px;">
                            </div>
                            <div id="emailStatus" style="display: none; margin-top: 5px;"></div>
                        </div>
                    </div>

                    <!-- Row 2: Phone -->
                    <div class="row">
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" placeholder="Enter your phone number" required>
                        </div>
                    </div>

                    <!-- Row 3: Password + Confirm Password -->
                    <div class="row">
                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="password-wrapper">
                                <input type="password" id="password" placeholder="Create a password" required>
                                <button type="button" class="toggle-password" data-target="password"
                                    aria-label="Show password">
                                    <img src="image/eye.png" alt="Show password" class="icon eye-icon">
                                    <img src="image/eye-crossed.png" alt="Hide password" class="icon eye-slash-icon"
                                        style="display: none;">
                                </button>
                            </div>
                            <!-- KEEP YOUR ID EXACTLY: passwordError -->
                            <div id="passwordError" class="password-error-message"
                                style="color: #dc3545; font-size: 0.875rem; margin-top: 5px; display: none;"></div>
                            <small class="text-muted">Password must be at least 8 characters with uppercase, lowercase,
                                number, and special character (@$!%*?&)</small>
                        </div>

                        <div class="form-group">
                            <label for="confirm_password">Confirm Password</label>
                            <div class="password-wrapper">
                                <input type="password" id="confirm_password" placeholder="Confirm your password"
                                    required>
                                <button type="button" class="toggle-password" data-target="confirm_password"
                                    aria-label="Show password">
                                    <img src="image/eye.png" alt="Show password" class="icon eye-icon">
                                    <img src="image/eye-crossed.png" alt="Hide password" class="icon eye-slash-icon"
                                        style="display: none;">
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="registerBtn" class="btn-submit">
                        Create Account
                    </button>

                    <!-- Footer Link -->
                    <div class="form-footer">
                        Already have an account? <a href="login">Login here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>



    </div>

    <script src="js/app.js"></script>
    <script src="js/registration.js"></script>
</body>

</html>
