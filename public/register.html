<!-- register.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Towing Assistance</title>

<link rel="stylesheet" href="css/registration.css">

</head>

<body>

<nav class="navbar">
    <div class="nav-container">
        <a class="navbar-brand" href="home">Tow Assist</a>
       <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="home">Home</a></li>
            </ul>
    </div>
</nav>

<div class="container">

    <div class="form-container">

        <h2>Create Account</h2>

        <form id="registerForm">

            <div class="row">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required>
                </div>

            </div>

            <div class="row">

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required>
                </div>

                <div class="form-group">
                    <label for="userType">Account Type</label>
                    <select id="userType" required>
                        <option value="">Customer</option>
                       
                    </select>
                </div>

            </div>

 <div class="row">
    <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
            <input type="password" id="password" required>
            <button type="button" class="toggle-password" data-target="password" aria-label="Show password">👁️</button>
        </div>
    </div>

    <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="password-wrapper">
            <input type="password" id="confirmPassword" required>
            <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show password">👁️</button>
        </div>
    </div>
</div>

            <button type="submit" id="registerBtn" class="btn-submit">
                Create Account
            </button>

        </form>

        <div class="form-footer">
            <p>Already have an account? <a href="login">Login here</a></p>
        </div>

    </div>

</div>

<script src="js/app.js"></script>
<script src="js/registration.js"></script>
</body>
</html>
